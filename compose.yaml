services:
  mysql:
    image: mysql:8.4
    container_name: crawl-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crawl_lab
      MYSQL_USER: crawler
      MYSQL_PASSWORD: crawler
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram_token_size=2
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - crawl-lab-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  mongo:
    image: mongo:8.0
    container_name: crawl-lab-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: crawler
      MONGO_INITDB_ROOT_PASSWORD: crawler
      MONGO_INITDB_DATABASE: crawl_lab
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - crawl-lab-mongo-data:/data/db

volumes:
  crawl-lab-mysql-data:
  crawl-lab-mongo-data:
